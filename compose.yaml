services:
  app:
    build: .
    restart: on-failure
    environment:
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    depends_on:
      - db
      - postgres
      - mariadb

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: admin_bases_datos
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: admin_bases_datos
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: admin_bases_datos
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_USER: app
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mysql_data:
  postgres_data:
  mariadb_data:
